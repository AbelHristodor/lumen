name: Release

# Manual-only release. Run from the Actions tab ("Run workflow") and supply a
# version such as v3.0.0. That value becomes the Git tag and the Release name.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v3.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # Iced on winit, rfd GTK dialogs, and ALSA headers.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev libasound2-dev

      # Render goldens skip with a message on runners without a GPU adapter.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Iced on winit, rfd GTK dialogs, and ALSA headers.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev libasound2-dev

      - name: Build
        run: cargo build --release -p sda-app --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="lumen-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/lumen" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          # Installs from before the rename self update by looking for
          # sda-manager-<target>/sda-manager. Drop this once they have moved on.
          legacy="sda-manager-${{ matrix.target }}"
          mkdir "$legacy"
          cp "target/${{ matrix.target }}/release/lumen" "$legacy/sda-manager"
          # The bare binary stays for install.sh upgrades. The .app gives
          # macOS a Dock and Finder icon.
          if [ "${{ runner.os }}" = "macOS" ]; then
            app="$staging/Lumen.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources"
            cp "target/${{ matrix.target }}/release/lumen" "$app/MacOS/"
            cp assets/icon.icns "$app/Resources/"
            version="${{ inputs.version }}"
            cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Lumen</string>
            <key>CFBundleDisplayName</key><string>Lumen</string>
            <key>CFBundleIdentifier</key><string>com.abelhristodor.lumen</string>
            <key>CFBundleExecutable</key><string>lumen</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version#v}</string>
            <key>CFBundleVersion</key><string>${version#v}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          fi
          tar -czf "$staging.tar.gz" "$staging" "$legacy"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "lumen-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lumen.exe" $staging
          Copy-Item README.md $staging -ErrorAction SilentlyContinue
          # Same legacy path as the unix step, for self update before the rename.
          $legacy = "sda-manager-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $legacy | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lumen.exe" "$legacy/sda-manager.exe"
          Compress-Archive -Path $staging,$legacy -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  hymns:
    name: Package hymns.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the hymn library
        run: cd assets/920 && zip -qr ../../hymns.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hymns
          path: hymns.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, hymns]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/*
