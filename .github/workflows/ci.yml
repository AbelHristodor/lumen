name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # Iced on winit, rfd GTK dialogs, and ALSA headers.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev libasound2-dev

      # Render goldens skip with a message on runners without a GPU adapter
      # or with only a software adapter.
      - name: Test
        run: cargo test --workspace

      # GitHub-hosted Windows runners expose a software D3D12 adapter (WARP).
      # It is not a hardware-performance test, but it exercises adapter/device
      # creation and compiles every production renderer pipeline on DX12.
      - name: Windows DX12 renderer smoke test
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
          LUMEN_REQUIRE_GPU: "1"
          RUST_LOG: wgpu_core=info,wgpu_hal=info
        run: cargo test -p sda-render --test gpu_smoke -- --nocapture

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
