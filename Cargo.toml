[workspace]
resolver = "2"
members = ["crates/sda-core", "crates/sda-render", "crates/sda-media", "crates/sda-app"]

[workspace.package]
edition = "2021"
version = "2.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"

# Optimize dependencies even in debug builds. Our own crates still compile
# unoptimized for fast iteration, but heavy deps such as nucleo-matcher, zip, wgpu
# run at full speed, so `cargo run` in debug already feels snappy.
[profile.dev.package."*"]
opt-level = 3

# Release: small single binary. Fat LTO plus opt-level "s" cut it from
# 26.8 MB to 17.8 MB on macOS arm. Drawing is on the GPU, so the CPU cost is
# small. Keep unwinding: workers turn panics into Err strings.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
