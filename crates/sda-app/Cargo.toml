[package]
name = "sda-app"
edition = "2024"
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sda-manager"
path = "src/main.rs"

[dependencies]
sda-core = { path = "../sda-core" }
sda-render = { path = "../sda-render" }
iced = { version = "0.14", features = ["wgpu", "image", "tokio", "advanced", "lazy", "canvas"] }
wgpu = { version = "27", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
cosmic-text = "0.15"
display-info = "0.5"
rfd = "0.17"
open = "5"
ureq = "2"
sys-locale = "0.3"
tempfile = "3"
anyhow = { workspace = true }
serde = { workspace = true }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
iced_test = "0.14"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
