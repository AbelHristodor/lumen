[package]
name = "sda-app"
edition = "2024"
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
sda-core = { path = "../sda-core" }
sda-render = { path = "../sda-render" }
sda-media = { path = "../sda-media" }
iced = { version = "0.14", features = ["wgpu", "image", "tokio", "advanced", "lazy", "canvas"] }
wgpu = { version = "27", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
cosmic-text = "0.15"
display-info = "0.5"
rfd = "0.17"
open = "5"
ureq = "2"
sys-locale = "0.3"
tempfile = "3"
anyhow = { workspace = true }
serde = { workspace = true }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
iced_test = "0.14"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Linux packages, built by .github/workflows/release.yml after
# `cargo build --release`. Paths are relative to this crate.
[package.metadata.deb]
name = "lumen"
maintainer = "Abel Hristodor <habelor@gmail.com>"
copyright = "Abel Hristodor"
extended-description = "Project hymns and Bible verses on a second screen."
section = "graphics"
depends = "$auto, libasound2 | libasound2t64"
assets = [
    ["target/release/lumen", "usr/bin/", "755"],
    ["../../packaging/linux/lumen.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.png", "usr/share/icons/hicolor/512x512/apps/lumen.png", "644"],
]

[package.metadata.generate-rpm]
name = "lumen"
summary = "Project hymns and Bible verses"
license = "NOASSERTION"
auto-req = "builtin"
assets = [
    { source = "target/release/lumen", dest = "/usr/bin/lumen", mode = "755" },
    { source = "../../packaging/linux/lumen.desktop", dest = "/usr/share/applications/lumen.desktop", mode = "644" },
    { source = "../../assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/lumen.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
